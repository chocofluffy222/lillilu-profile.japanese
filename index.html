<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>リルリルと仲間たち｜自己紹介</title>
  <style>
    body{margin:0;font-family:system-ui,-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;background:#fff;}
    .wrap{max-width:980px;margin:0 auto;padding:18px;}
    .hint{margin:0 0 10px;color:#6b5b57;font-weight:800;letter-spacing:.02em}
    .stage{position:relative;border-radius:18px;overflow:hidden;}
    .img{width:100%;display:block;}
    .hotspot{
      position:absolute; border-radius:999px;
      /* 透明のタップ領域 */
      background:rgba(255,255,255,0);
      -webkit-tap-highlight-color: transparent;
    }
    .hotspot:focus{outline:3px solid rgba(255,170,200,.7); outline-offset:2px;}
    /* デバッグ用：位置合わせしたい時だけ ?debug=1 をURLの最後につける */
    .debug .hotspot{background:rgba(255,0,0,.18); outline:2px solid rgba(255,0,0,.35);}
</style>
</head>

<body>
    <div class="stage">
      <!-- 入口画像（あなたのリポジトリにあるファイル名に合わせてる） -->
      <img class="img" src="01_cover.png" alt="気になる子の顔をタップして" />

      <!-- ここから“顔タップ”の透明リンク（位置はだいたい。微調整は後でOK） -->
      <a class="hotspot" href="lillilu.html" aria-label="リルリル"
         style="left:41%; top:57%; width:18%; height:18%;"></a>

      <a class="hotspot" href="espie.html" aria-label="エスピー"
         style="left:18%; top:35%; width:22%; height:22%;"></a>

      <a class="hotspot" href="gigi.html" aria-label="ジジ"
         style="left:58%; top:18%; width:22%; height:22%;"></a>

      <a class="hotspot" href="bonbon.html" aria-label="ボンボン"
         style="left:66%; top:40%; width:20%; height:20%;"></a>

      <a class="hotspot" href="rosie.html" aria-label="ロージー"
         style="left:12%; top:55%; width:18%; height:18%;"></a>

      <a class="hotspot" href="finn.html" aria-label="フィン"
         style="left:56%; top:64%; width:16%; height:16%;"></a>

      <a class="hotspot" href="levy.html" aria-label="レヴィ"
         style="left:75%; top:50%; width:18%; height:18%;"></a>
    </div>
  </div>

  <script>
    // ?debug=1 を付けた時だけ、赤く見えるようにする（位置合わせが超ラク）
    const params = new URLSearchParams(location.search);
    if (params.get('debug') === '1') document.getElementById('root').classList.add('debug');
  </script>
</body>
</html>
