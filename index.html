<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>リルリルと仲間たち｜自己紹介</title>

  <style>
    body{
      margin:0;
      font-family:system-ui,-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;
      background:
        radial-gradient(circle at top left,
          rgba(255, 220, 235, 0.95) 0%,
          rgba(255, 220, 235, 0.55) 35%,
          transparent 62%
        ),
        radial-gradient(circle at bottom right,
          rgba(210, 220, 255, 0.95) 0%,
          rgba(210, 220, 255, 0.55) 35%,
          transparent 62%
        ),
        linear-gradient(180deg,#ffeaf3 0%,#efe7ff 55%,#e9f2ff 100%);
    }

    body::before{
      content:"";
      position:fixed;
      inset:0;
      background:
        radial-gradient(circle at 30% 20%, rgba(255,255,255,.32), transparent 42%),
        radial-gradient(circle at 70% 80%, rgba(255,255,255,.22), transparent 46%);
      pointer-events:none;
      z-index:0;
    }

    .stage{
      position:relative;
      border-radius:18px;
      overflow:hidden;
      margin:10vh auto 0;
      max-width:980px;
      box-shadow:0 12px 30px rgba(180,160,200,.25);
      z-index:1;
    }

    .img{width:100%;display:block;}

    .hotspot{
      position:absolute;
      border-radius:999px;
      background:rgba(255,255,255,0);
      -webkit-tap-highlight-color: transparent;
    }
    .hotspot:focus{outline:3px solid rgba(255,170,200,.7); outline-offset:2px;}
    .debug .hotspot{background:rgba(255,0,0,.18); outline:2px solid rgba(255,0,0,.35);}

    /* タップ時キラッ */
    .spark{
      position:fixed; /* ← iPhoneでも確実に見せる */
      width:22px; height:22px;
      pointer-events:none;
      transform:translate(-50%,-50%) scale(.6) rotate(0deg);
      opacity:0;
      animation:spark .55s ease-out forwards;
      filter: drop-shadow(0 2px 6px rgba(255, 214, 120, .7));
      z-index:10;
    }
    @keyframes spark{
      0%   {opacity:0; transform:translate(-50%,-50%) scale(.3) rotate(0deg);}
      20%  {opacity:1; transform:translate(-50%,-50%) scale(1) rotate(20deg);}
      100% {opacity:0; transform:translate(-50%,-50%) scale(1.4) rotate(70deg);}
    }

    /* 自動ハート（通常時） */
    .heart{
      position:fixed;
      width:32px;
      height:32px;
      pointer-events:none;
      opacity:0;
      animation: heartFloat 3.0s ease-out forwards;
      filter:
        drop-shadow(0 0 6px rgba(255,180,200,.95))
        drop-shadow(0 0 18px rgba(255,140,180,.7));
      z-index:9;
    }
    @keyframes heartFloat{
      0%{opacity:0; transform:translate(-50%,-50%) scale(.4);}
      20%{opacity:1;}
      100%{opacity:0; transform:translate(-50%,-90%) scale(1.4);}
    }

    /* ランダムきらきら（通常時） */
    .twinkle{
      position:fixed;
      width:14px;height:14px;
      pointer-events:none;
      opacity:0;
      animation: twinkle 0.75s ease-out forwards;
      filter: drop-shadow(0 0 9px rgba(255,215,150,.6));
      z-index:8;
    }
    @keyframes twinkle{
      0%{opacity:0; transform:translate(-50%,-50%) scale(.55) rotate(0deg);}
      25%{opacity:1;}
      100%{opacity:0; transform:translate(-50%,-50%) scale(1.2) rotate(40deg);}
    }
  </style>
</head>

<body>
  <div class="stage" id="root">
    <!-- ★ ここを新しい画像ファイル名に変えてね -->
    <img class="img" src="01_cover.png" alt="気になる子の顔をタップして" />

    <a class="hotspot" href="lillilu.html" aria-label="リルリル"
       style="left:41%; top:57%; width:18%; height:18%;"></a>

    <a class="hotspot" href="espie.html" aria-label="エスピー"
       style="left:18%; top:35%; width:22%; height:22%;"></a>

    <a class="hotspot" href="gigi.html" aria-label="ジジ"
       style="left:58%; top:18%; width:22%; height:22%;"></a>

    <a class="hotspot" href="bonbon.html" aria-label="ボンボン"
       style="left:64%; top:40%; width:18%; height:18%;"></a>

    <a class="hotspot" href="rosie.html" aria-label="ロージー"
       style="left:12%; top:55%; width:18%; height:18%;"></a>

    <a class="hotspot" href="finn.html" aria-label="フィン"
       style="left:56%; top:64%; width:16%; height:16%;"></a>

    <a class="hotspot" href="levy.html" aria-label="レヴィ"
       style="left:70%; top:56%; width:16%; height:16%;"></a>
  </div>

  <script>
    // debug：URLの最後に ?debug=1 を付けると赤枠表示
    const params = new URLSearchParams(location.search);
    if (params.get('debug') === '1') document.getElementById('root').classList.add('debug');

    // タップした場所にキラッ✨（クリック位置が取れない時は中心に出す）
    function bindTapSpark(selector){
      document.querySelectorAll(selector).forEach(a=>{
        a.addEventListener('click', (e)=>{
          const rect = a.getBoundingClientRect();
          const x = (e.clientX || (rect.left + rect.width/2));
          const y = (e.clientY || (rect.top  + rect.height/2));

          const s = document.createElement('div');
          s.className = 'spark';
          s.style.left = x + 'px';
          s.style.top  = y + 'px';
          s.innerHTML = `
            <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
              <path fill="rgba(255,210,120,.95)"
                d="M12 0l2.2 7.2L21.5 9l-7.3 2.1L12 18l-2.2-6.9L2.5 9l7.3-1.8L12 0z"/>
            </svg>`;
          document.body.appendChild(s);
          setTimeout(()=>s.remove(), 650);
        }, {passive:true});
      });
    }

    // ★ 自動ハート（通常時）
    // まず「動いてるか確認」用に 1秒固定にしてる（OKなら後で 3500〜6500 に戻して）
    function startAutoHeart(){
      const min = 1000;  // ←テスト用（OKなら 3500）
      const max = 1000;  // ←テスト用（OKなら 6500）

      function spawnHeart(){
        const h = document.createElement('div');
        h.className = 'heart';

        const x = Math.random() * 84 + 8; // 8〜92vw
        h.style.left = '50vh';
        h.style.top  = '55vh'; // 

        h.innerHTML = `
          <svg viewBox="0 0 24 24" width="32" height="32" aria-hidden="true">
            <path fill="rgba(255,170,200,1)"
              d="M12 21s-6.7-4.6-9.5-8.2C.6 10.4 1.1 6.9 4.1 5.4
                 6.1 4.4 8.4 5.2 9.6 7c1.2-1.8 3.5-2.6 5.5-1.6
                 3 1.5 3.5 5 1.6 7.4C18.7 16.4 12 21 12 21z"/>
          </svg>`;
        document.body.appendChild(h);
        setTimeout(()=>h.remove(), 1700);

        const next = Math.random() * (max - min) + min;
        setTimeout(spawnHeart, next);
      }

      setTimeout(spawnHeart, 600);
    }

    // 通常時きらきら（ランダム）
    function startTwinkle(){
      const min = 3000;
      const max = 6000;

      function spawnTwinkle(){
        const t = document.createElement('div');
        t.className = 'twinkle';

        const x = Math.random() * 84 + 8;
        const y = Math.random() * 70 + 10;
        t.style.left = x + 'vw';
        t.style.top  = y + 'vh';

        t.innerHTML = `
          <svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true">
            <path fill="rgba(255,215,150,.95)"
              d="M12 0l2.2 7.2L21.5 9l-7.3 2.1L12 18l-2.2-6.9L2.5 9l7.3-1.8L12 0z"/>
          </svg>`;
        document.body.appendChild(t);
        setTimeout(()=>t.remove(), 800);

        const next = Math.random() * (max - min) + min;
        setTimeout(spawnTwinkle, next);
      }

      setTimeout(spawnTwinkle, 1800);
    }

    // ★ここがポイント：DOMContentLoadedを使わず、確実に直実行
    bindTapSpark('.hotspot');
    startAutoHeart();
    startTwinkle();
  </script>
</body>
</html>
