<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>リルリルと仲間たち｜自己紹介</title>
  <style>
   body{
  margin:0;
  font-family:system-ui,-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;
  background:
    radial-gradient(circle at top left, #fff6fb 0%, transparent 40%),
    radial-gradient(circle at bottom right, #f4f8ff 0%, transparent 40%),
    linear-gradient(180deg, #fffafc 0%, #f7f5ff 100%);
}
    .wrap{max-width:980px;margin:0 auto;padding:18px;padding-top:48px;}
    .hint{margin:0 0 10px;color:#6b5b57;font-weight:800;letter-spacing:.02em}
    .stage{
  position:relative;
  border-radius:18px;
  overflow:hidden;
  box-shadow:0 12px 30px rgba(180,160,200,.25); /* 追加 */
}
    .img{width:100%;display:block;}
    .hotspot{
      position:absolute; border-radius:999px;
      /* 透明のタップ領域 */
      background:rgba(255,255,255,0);
      -webkit-tap-highlight-color: transparent;
    }
    .hotspot:focus{outline:3px solid rgba(255,170,200,.7); outline-offset:2px;}
    /* デバッグ用：位置合わせしたい時だけ ?debug=1 をURLの最後につける */
    .debug .hotspot{background:rgba(255,0,0,.18); outline:2px solid rgba(255,0,0,.35);}
  /* タップ時キラッ演出 */
  .spark{
    position:absolute;
    width:22px; height:22px;
    pointer-events:none;
    transform:translate(-50%,-50%) scale(.6) rotate(0deg);
    opacity:0;
    animation:spark .55s ease-out forwards;
    filter: drop-shadow(0 2px 6px rgba(255, 214, 120, .7));
  }
  @keyframes spark{
    0%   {opacity:0; transform:translate(-50%,-50%) scale(.3) rotate(0deg);}
    20%  {opacity:1; transform:translate(-50%,-50%) scale(1) rotate(20deg);}
    100% {opacity:0; transform:translate(-50%,-50%) scale(1.4) rotate(70deg);}
  }

  </style>
</head>

<body>
    <div class="stage">
      <!-- 入口画像（あなたのリポジトリにあるファイル名に合わせてる） -->
      <img class="img" src="01_cover.png" alt="気になる子の顔をタップして" />

      <!-- ここから“顔タップ”の透明リンク（位置はだいたい。微調整は後でOK） -->
      <a class="hotspot" href="lillilu.html" aria-label="リルリル"
         style="left:41%; top:57%; width:18%; height:18%;"></a>

      <a class="hotspot" href="espie.html" aria-label="エスピー"
         style="left:18%; top:35%; width:22%; height:22%;"></a>

      <a class="hotspot" href="gigi.html" aria-label="ジジ"
         style="left:58%; top:18%; width:22%; height:22%;"></a>

      <a class="hotspot" href="bonbon.html" aria-label="ボンボン"
         style="left:64%; top:40%; width:18%; height:18%;"></a>

      <a class="hotspot" href="rosie.html" aria-label="ロージー"
         style="left:12%; top:55%; width:18%; height:18%;"></a>

      <a class="hotspot" href="finn.html" aria-label="フィン"
         style="left:56%; top:64%; width:16%; height:16%;"></a>

      <a class="hotspot" href="levy.html" aria-label="レヴィ"
         style="left:70%; top:56%; width:16%; height:16%;"></a>
    </div>
  </div>

  <script>
    // ?debug=1 を付けた時だけ、赤く見えるようにする（位置合わせが超ラク）
    const params = new URLSearchParams(location.search);
    if (params.get('debug') === '1') document.getElementById('root').classList.add('debug');
  </script>
<script>
  // タップした場所にキラッ✨を出す
  document.querySelectorAll('.hotspot').forEach(a=>{
    a.addEventListener('click', (e)=>{
      const rect = a.getBoundingClientRect();
      const x = (e.clientX || (rect.left + rect.width/2));
      const y = (e.clientY || (rect.top  + rect.height/2));

      const s = document.createElement('div');
      s.className = 'spark';
      s.style.left = x + 'px';
      s.style.top  = y + 'px';
      s.innerHTML = `
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
          <path fill="rgba(255,210,120,.95)" d="M12 0l2.2 7.2L21.5 9l-7.3 2.1L12 18l-2.2-6.9L2.5 9l7.3-1.8L12 0z"/>
        </svg>`;
      document.body.appendChild(s);
      setTimeout(()=>s.remove(), 650);
    }, {passive:true});
  });
</script>

</body>
</html>
